tags:
  - Contacts
summary: Delete a contact by ID
operationId: deleteContact
description: Delete a contact by its ID.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
    example: 507f1f77bcf86cd799439011
responses:
  '200':
    description: Contact successfully deleted
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully deleted contact'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'
