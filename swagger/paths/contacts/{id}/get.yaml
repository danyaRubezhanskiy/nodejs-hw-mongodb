tags:
  - Contacts
summary: Get a contact by ID
operationId: getContactById
description: Get a contact by ID.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
    example: 507f1f77bcf86cd799439011
responses:
  '200':
    description: Contact found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contact with id 507f1f77bcf86cd799439011'
            data:
              $ref: ../../../components/schemas/contacts.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact not found'
            data:
              type: object
              example: {}
