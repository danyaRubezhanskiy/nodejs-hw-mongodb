tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve a paginated list of contacts with optional sorting and filtering.
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      example: 1
    description: Page number for pagination, starting from 1.
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      example: 10
    description: Number of contacts per page.
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      example: 'name'
    description: Field by which to sort contacts, e.g., 'name' or 'createdAt'.
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
      example: 'asc'
    description: Order of sorting - 'asc' for ascending, 'desc' for descending.
responses:
  '200':
    description: List of contacts with pagination metadata
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully retrieved contacts'
            data:
              type: array
              items:
                $ref: ../../components/schemas/contacts.yaml
            totalItems:
              type: integer
              example: 100
            page:
              type: integer
              example: 1
            perPage:
              type: integer
              example: 10
            totalPages:
              type: integer
              example: 10
            hasNextPage:
              type: boolean
              example: true
            hasPreviousPage:
              type: boolean
              example: false
  '404':
    description: No contacts found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'No contacts found'
