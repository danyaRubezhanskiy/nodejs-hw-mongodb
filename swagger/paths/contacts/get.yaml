tags:
  - Contacts
summary: Get a list of all contacts
operationId: getAllContacts
description: Retrieve a list of all contacts with optional filters.
security:
  - bearerAuth: []
parameters:
  - name: name
    in: query
    required: false
    schema:
      type: string
    description: Filter contacts by name
    example: 'John Doe'
  - name: contactType
    in: query
    required: false
    schema:
      type: string
    description: Filter contacts by contact type (e.g., personal, work)
    example: 'work'
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
    description: Page number for pagination
    example: 1
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
    description: Number of contacts per page
    example: 10
responses:
  '200':
    description: A list of contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contacts retrieved successfully'
            data:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/contacts.yaml
                pagination:
                  type: object
                  properties:
                    totalItems:
                      type: integer
                      example: 50
                    totalPages:
                      type: integer
                      example: 5
                    currentPage:
                      type: integer
                      example: 1
                    pageSize:
                      type: integer
                      example: 10
  '404':
    description: No contacts found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'No contacts found'
